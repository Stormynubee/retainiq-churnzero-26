[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retainiq"
version = "0.3.0"
description = "Cost-aware churn retention engine for ChurnZero 26 (IIT Kharagpur)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Hansraj Tiwari" },
  { name = "swayangjeet nayak" },
]
keywords = ["churn", "machine-learning", "lightgbm", "uplift", "fairness"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "pyarrow>=15.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
deck = ["python-pptx>=1.0"]
notebook = ["jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
retainiq-train = "retainiq.pipeline:train_cli"
retainiq-predict = "retainiq.pipeline:predict_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: full pipeline or model training",
  "integration: needs data/raw CSVs on disk",
]
addopts = "-ra --strict-markers"
