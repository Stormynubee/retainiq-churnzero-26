name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
      - name: Unit tests (no slow / no integration)
        run: pytest -m "not slow and not integration" --cov=retainiq --cov-report=term-missing
